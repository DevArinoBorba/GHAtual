  <path d="M 235 95 C 220 52, 175 35, 128 35 C 65 35, 20 85, 20 152 L 20 162 L 68 162 L 68 152 C 68 108, 92 78, 128 78 C 160 78, 185 96, 196 130 L 235 95 Z" fill="currentColor" />
  <!-- Lower arc of G -->
